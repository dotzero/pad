<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Padname }} — Pad</title>
    <link href="/favicon.png" rel="icon" type="image/png" />
    <link href="/assets/css/application.css" rel="stylesheet" media="screen" />
    <link href="/assets/css/print.css" rel="stylesheet" media="print" />
</head>
<body class="m-0 min-h-screen overflow-x-hidden bg-[#ebeef2] bg-[url('/assets/images/bg.png')] bg-left-top bg-repeat p-0 font-sans text-sm font-normal text-[#b7bdc3]">
    <div class="hidden max-[640px]:absolute max-[640px]:left-4 max-[640px]:right-4 max-[640px]:top-[18px] max-[640px]:z-[2] max-[640px]:block">
        <div class="grid grid-cols-2 gap-2.5 max-[640px]:gap-2">
            <button type="button" id="copy_button" class="min-h-[42px] min-w-0 cursor-pointer rounded-[10px] border border-[#cfd5dc] bg-[#f7f9fb] px-4 py-0 font-sans text-sm font-normal text-[#3a3b3c] [-webkit-tap-highlight-color:transparent] active:bg-[#e9edf2] max-[640px]:min-h-[46px] max-[640px]:w-full max-[640px]:px-3 max-[640px]:text-[15px]">Copy</button>
            <button type="button" id="paste_button" class="min-h-[42px] min-w-0 cursor-pointer rounded-[10px] border border-[#cfd5dc] bg-[#f7f9fb] px-4 py-0 font-sans text-sm font-normal text-[#3a3b3c] [-webkit-tap-highlight-color:transparent] active:bg-[#e9edf2] max-[640px]:min-h-[46px] max-[640px]:w-full max-[640px]:px-3 max-[640px]:text-[15px]">Paste</button>
        </div>
    </div>
    <div class="stack absolute bottom-[45px] left-[30px] right-[30px] top-[30px] rounded-[3px] shadow-[0_0_9px_rgba(121,126,133,0.15)] max-[640px]:bottom-6 max-[640px]:left-4 max-[640px]:right-4 max-[640px]:top-[82px]">
        <div class="absolute -top-0.5 bottom-0 left-0 right-0 rounded-[3px] bg-[#fdfeff] shadow-[0_1px_2px_rgba(80,83,87,0.25)]">
            <div class="absolute -top-px bottom-0.5 -left-0.5 -right-0.5 rounded-[3px] bg-[#fdfeff] shadow-[0_1px_0_rgba(61,64,67,0.2)]">
                <div class="absolute bottom-px -left-0.5 -right-0.5 top-0 rounded-[3px] border border-[#dcdde1] bg-[#fdfeff] px-5 py-[18px] font-sans text-[15px] font-normal leading-5 text-[#3a3b3c] max-[640px]:px-3.5 max-[640px]:pb-4 max-[640px]:pt-3.5">
                    <textarea name="contents" id="contents" class="pad-contents m-0 h-full w-full resize-none overflow-y-auto whitespace-pre-wrap border border-transparent bg-transparent py-0 pl-0 pr-1.5 font-sans text-[15px] font-normal leading-5 text-[#3a3b3c] max-[640px]:text-base" spellcheck="true">{{ .Content }}</textarea>
                </div>
            </div>
        </div>
    </div>
    <div id="printable_contents" class="pad-contents hidden"></div>
    <div id="loading" class="absolute left-[30px] top-3 hidden h-[7px] w-3.5 rounded-px border border-[#9ba0a5] opacity-40 transition-opacity duration-1000 ease-linear max-[640px]:left-[18px] max-[640px]:top-3.5"></div>

    <script src="https://code.jquery.com/jquery.min.js"></script>
    <script src="/assets/js/application.js"></script>
</body>
</html>
